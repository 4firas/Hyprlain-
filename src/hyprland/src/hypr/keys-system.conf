# --- Desktop shortcuts, the same in every app (see keys.conf) ---

# Spotlight, Finder, emoji, help
bind = $MOD, space, exec, $spotlight
bind = $MOD ALT, space, exec, $files
bind = $MOD CTRL, space, exec, $pickEmoji
bind = $MOD SHIFT, slash, exec, $HYPRSCRIPT/cheatsheet.sh
bind = $MOD SHIFT, V, exec, $clipboardHistory

# App switcher (scripts/app-switcher.py): tap ⌘Tab for the last app, hold ⌘ to pick one
bind = $MOD, Tab, exec, $HYPRSCRIPT/app-switcher next
bind = $MOD SHIFT, Tab, exec, $HYPRSCRIPT/app-switcher prev
bind = $MOD, grave, exec, $HYPRSCRIPT/app-switcher grave
bind = $MOD, Escape, exec, $HYPRSCRIPT/app-switcher cancel
bindrt = $MOD, Super_L, exec, $HYPRSCRIPT/app-switcher commit
bindrt = $MOD SHIFT, Super_L, exec, $HYPRSCRIPT/app-switcher commit
bindrt = $MOD, Super_R, exec, $HYPRSCRIPT/app-switcher commit

# Quit, hide, minimize, close, force quit
bind = $MOD, Q, exec, $HYPRSCRIPT/quit-app
bind = $MOD, H, movetoworkspacesilent, special:minimized
bind = $MOD, M, movetoworkspacesilent, special:minimized
bind = $MOD ALT, M, togglespecialworkspace, minimized
bind = $MOD SHIFT, W, killactive
bind = $MOD ALT, Escape, exec, $HYPRSCRIPT/force-quit

# Input source. Lock and log out live in the Lain menu: ⌃⌘Q and ⇧⌘Q stay unbound so that
# in a VM whose input isn't captured they can only ever reach macOS, never surprise it.
bind = CTRL, space, exec, hyprctl switchxkblayout all next

# Screenshots: ⌘⇧3 screen, ⌘⇧4 area, ⌘⇧5 window (saved to ~/Pictures/Screenshots); add ⌃ to copy only
bind = $MOD SHIFT, 3, exec, $HYPRSCRIPT/screenshot screen
bind = $MOD SHIFT, 4, exec, $HYPRSCRIPT/screenshot area
bind = $MOD SHIFT, 5, exec, $HYPRSCRIPT/screenshot window
bind = $MOD CTRL SHIFT, 3, exec, $HYPRSCRIPT/screenshot screen copy
bind = $MOD CTRL SHIFT, 4, exec, $HYPRSCRIPT/screenshot area copy
bind = $MOD CTRL SHIFT, 5, exec, $HYPRSCRIPT/screenshot window copy
bind = , Print, exec, $HYPRSCRIPT/screenshot area
bind = $MOD SHIFT, C, exec, $colorPicker

# Mission Control (scripts/app-switcher.py) and desktops (Spaces)
bind = CTRL, up, exec, $HYPRSCRIPT/app-switcher overview
bind = CTRL, left, workspace, r-1
bind = CTRL, right, workspace, r+1
bind = CTRL SHIFT, left, movetoworkspace, r-1
bind = CTRL SHIFT, right, movetoworkspace, r+1
bind = CTRL, 1, workspace, 1
bind = CTRL, 2, workspace, 2
bind = CTRL, 3, workspace, 3
bind = CTRL, 4, workspace, 4
bind = CTRL, 5, workspace, 5
bind = CTRL, 6, workspace, 6
bind = CTRL, 7, workspace, 7
bind = CTRL, 8, workspace, 8
bind = CTRL, 9, workspace, 9
bind = CTRL SHIFT, 1, movetoworkspace, 1
bind = CTRL SHIFT, 2, movetoworkspace, 2
bind = CTRL SHIFT, 3, movetoworkspace, 3
bind = CTRL SHIFT, 4, movetoworkspace, 4
bind = CTRL SHIFT, 5, movetoworkspace, 5
bind = CTRL SHIFT, 6, movetoworkspace, 6
bind = CTRL SHIFT, 7, movetoworkspace, 7
bind = CTRL SHIFT, 8, movetoworkspace, 8
bind = CTRL SHIFT, 9, movetoworkspace, 9

# Windows: ⌃⌘F full screen, ⌥⌘F float, ⌥⌘ arrows focus, ⇧⌥⌘ arrows move, ⌃⌘ arrows resize.
# Nothing here holds ⌃ and ⌥ together: UTM toggles its input capture on that chord.
bind = $MOD CTRL, F, fullscreen, 0
bind = $MOD ALT, F, togglefloating
bind = $MOD ALT, P, pin
bind = $MOD ALT, left, movefocus, l
bind = $MOD ALT, right, movefocus, r
bind = $MOD ALT, up, movefocus, u
bind = $MOD ALT, down, movefocus, d
bind = $MOD ALT SHIFT, left, movewindow, l
bind = $MOD ALT SHIFT, right, movewindow, r
bind = $MOD ALT SHIFT, up, movewindow, u
bind = $MOD ALT SHIFT, down, movewindow, d
bind = $MOD ALT, Return, layoutmsg, togglesplit
binde = $MOD CTRL, left, resizeactive, -40 0
binde = $MOD CTRL, right, resizeactive, 40 0
binde = $MOD CTRL, up, resizeactive, 0 -40
binde = $MOD CTRL, down, resizeactive, 0 40
bindm = $MOD, mouse:272, movewindow
bindm = $MOD, mouse:273, resizewindow

# Desktop, Dock, menu bar, display size
bind = $MOD ALT, D, exec, $HYPRSCRIPT/dock toggle
bind = $MOD ALT, B, exec, $toggleBar
bind = $MOD, F3, exec, $HYPRSCRIPT/toggle_desktop
bind = $MOD ALT, equal, exec, $HYPRSCRIPT/display-scale up
bind = $MOD ALT, minus, exec, $HYPRSCRIPT/display-scale down
bind = $MOD ALT SHIFT, space, exec, $toggleDebugOverlay

# Zoom (accessibility): ⌥⌘ scroll
bind = $MOD ALT, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 + 0.5}')
bind = $MOD ALT, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print ($2 > 1.5) ? $2 - 0.5 : 1}')

# Media and hardware keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# MacBook lid: logind ignores it, so blank the panel here
bindl = , switch:on:Lid Switch, exec, hyprctl dispatch dpms off
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on
