# --- ⌘ app shortcuts for regular (non-terminal) apps, see keys.conf ---
# sendshortcut delivers the Linux equivalent to the focused window only.

# ⌘ + letter -> Ctrl + letter (⌘Q, ⌘H and ⌘M are desktop shortcuts)
bind = $MOD, A, sendshortcut, CTRL, A, activewindow
bind = $MOD, B, sendshortcut, CTRL, B, activewindow
bind = $MOD, C, sendshortcut, CTRL, C, activewindow
bind = $MOD, D, sendshortcut, CTRL, D, activewindow
bind = $MOD, E, sendshortcut, CTRL, E, activewindow
bind = $MOD, F, sendshortcut, CTRL, F, activewindow
bind = $MOD, G, sendshortcut, CTRL, G, activewindow
bind = $MOD, I, sendshortcut, CTRL, I, activewindow
bind = $MOD, J, sendshortcut, CTRL, J, activewindow
bind = $MOD, K, sendshortcut, CTRL, K, activewindow
bind = $MOD, L, sendshortcut, CTRL, L, activewindow
bind = $MOD, N, sendshortcut, CTRL, N, activewindow
bind = $MOD, O, sendshortcut, CTRL, O, activewindow
bind = $MOD, P, sendshortcut, CTRL, P, activewindow
bind = $MOD, R, sendshortcut, CTRL, R, activewindow
bind = $MOD, S, sendshortcut, CTRL, S, activewindow
bind = $MOD, T, sendshortcut, CTRL, T, activewindow
bind = $MOD, U, sendshortcut, CTRL, U, activewindow
bind = $MOD, V, sendshortcut, CTRL, V, activewindow
bind = $MOD, W, sendshortcut, CTRL, W, activewindow
bind = $MOD, X, sendshortcut, CTRL, X, activewindow
bind = $MOD, Y, sendshortcut, CTRL, Y, activewindow
bind = $MOD, Z, sendshortcut, CTRL, Z, activewindow
bind = $MOD, comma, sendshortcut, CTRL, comma, activewindow
bind = $MOD, slash, sendshortcut, CTRL, slash, activewindow
bind = $MOD, Return, sendshortcut, CTRL, Return, activewindow
bind = $MOD, period, sendshortcut, , Escape, activewindow
bind = $MOD SHIFT, A, sendshortcut, CTRL SHIFT, A, activewindow
bind = $MOD SHIFT, F, sendshortcut, CTRL SHIFT, F, activewindow
bind = $MOD SHIFT, G, sendshortcut, CTRL, L, activewindow
bind = $MOD SHIFT, N, sendshortcut, CTRL SHIFT, N, activewindow
bind = $MOD SHIFT, P, sendshortcut, CTRL SHIFT, P, activewindow
bind = $MOD SHIFT, R, sendshortcut, CTRL SHIFT, R, activewindow
bind = $MOD SHIFT, S, sendshortcut, CTRL SHIFT, S, activewindow
bind = $MOD SHIFT, T, sendshortcut, CTRL SHIFT, T, activewindow
bind = $MOD SHIFT, Z, sendshortcut, CTRL SHIFT, Z, activewindow

# Zoom, tabs, history
bind = $MOD, equal, sendshortcut, CTRL, equal, activewindow
bind = $MOD, plus, sendshortcut, CTRL, plus, activewindow
bind = $MOD, minus, sendshortcut, CTRL, minus, activewindow
bind = $MOD, 0, sendshortcut, CTRL, 0, activewindow
bind = $MOD SHIFT, bracketleft, sendshortcut, CTRL SHIFT, Tab, activewindow
bind = $MOD SHIFT, bracketright, sendshortcut, CTRL, Tab, activewindow
bind = $MOD, bracketleft, sendshortcut, ALT, left, activewindow
bind = $MOD, bracketright, sendshortcut, ALT, right, activewindow
bind = $MOD, 1, sendshortcut, ALT, 1, activewindow
bind = $MOD, 2, sendshortcut, ALT, 2, activewindow
bind = $MOD, 3, sendshortcut, ALT, 3, activewindow
bind = $MOD, 4, sendshortcut, ALT, 4, activewindow
bind = $MOD, 5, sendshortcut, ALT, 5, activewindow
bind = $MOD, 6, sendshortcut, ALT, 6, activewindow
bind = $MOD, 7, sendshortcut, ALT, 7, activewindow
bind = $MOD, 8, sendshortcut, ALT, 8, activewindow
bind = $MOD, 9, sendshortcut, ALT, 9, activewindow

# Text navigation: ⌥ moves by word, ⌘ by line or document, ⇧ extends the selection
binde = ALT, left, sendshortcut, CTRL, left, activewindow
binde = ALT, right, sendshortcut, CTRL, right, activewindow
binde = ALT, up, sendshortcut, CTRL, up, activewindow
binde = ALT, down, sendshortcut, CTRL, down, activewindow
binde = ALT SHIFT, left, sendshortcut, CTRL SHIFT, left, activewindow
binde = ALT SHIFT, right, sendshortcut, CTRL SHIFT, right, activewindow
binde = $MOD, left, sendshortcut, , Home, activewindow
binde = $MOD, right, sendshortcut, , End, activewindow
binde = $MOD, up, sendshortcut, CTRL, Home, activewindow
binde = $MOD, down, sendshortcut, CTRL, End, activewindow
binde = $MOD SHIFT, left, sendshortcut, SHIFT, Home, activewindow
binde = $MOD SHIFT, right, sendshortcut, SHIFT, End, activewindow
binde = $MOD SHIFT, up, sendshortcut, CTRL SHIFT, Home, activewindow
binde = $MOD SHIFT, down, sendshortcut, CTRL SHIFT, End, activewindow
binde = ALT, BackSpace, sendshortcut, CTRL, BackSpace, activewindow
binde = ALT, Delete, sendshortcut, CTRL, Delete, activewindow
bind = $MOD, BackSpace, exec, hyprctl --batch "dispatch sendshortcut SHIFT, Home, activewindow ; dispatch sendshortcut , BackSpace, activewindow"
