# --- Mac-style keyboard ---
# ⌘ Command = SUPER, ⌥ Option = ALT, ⌃ Control = CTRL, ⇧ Shift = SHIFT.
#
# keys-system.conf  desktop shortcuts (Spotlight, ⌘Tab, Mission Control, desktops,
#                   screenshots, window management); active in every app.
# keys-apps.conf    ⌘ app shortcuts (⌘C, ⌘T, ⌘←, ⌥⌫ ...) translated to what Linux apps
#                   expect (Ctrl+C, Ctrl+T, Home, Ctrl+Backspace ...).
#
# Terminals understand ⌘ and ⌥ themselves (see kitty.conf), so while one is focused
# scripts/mac-keys switches to the mac-terminal submap, which carries only the desktop
# shortcuts and lets every other ⌘/⌥ combination through untouched.

$MOD = SUPER

source = ~/.config/hypr/keys-system.conf
source = ~/.config/hypr/keys-apps.conf

submap = mac-terminal
source = ~/.config/hypr/keys-system.conf
submap = reset
