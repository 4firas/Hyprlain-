# --- Standard Apps ---
$terminal = kitty
$browser = $HOME/.config/hypr/scripts/browser
$files = nautilus
$editor = nvim
$zoom = woomer
$menu = rofi
$bar = waybar

# --- Specialized Apps ---
# This opens Apple Music as a standalone window
$music = $HOME/.config/hypr/scripts/browser --app=https://music.apple.com

# --- Tools ---
$HYPRSCRIPT = $HOME/.config/hypr/scripts
$spotlight = pkill -x rofi || rofi -show drun -theme ~/.config/rofi/spotlight.rasi
$clipboardHistory = $HYPRSCRIPT/clipboard
$colorPicker = hyprpicker -a -fhex
$startTimer = $HYPRSCRIPT/timer
$pickEmoji = pkill -x rofi || rofi -show emoji -theme ~/.config/rofi/spotlight.rasi
$toggleDebugOverlay = $HYPRSCRIPT/toggle_debug_overlay
$activateMenu = killall $menu || $menu -show combi
$toggleBar = killall -SIGUSR1 $bar

# --- Startup ---
exec-once = $bar
exec-once = $HYPRSCRIPT/mac-keys
exec-once = $HYPRSCRIPT/dock start
exec-once = $HYPRSCRIPT/app-switcher daemon
exec-once = waycorner
exec-once = udiskie
exec-once = dunst
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-clip-persist --clipboard regular
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = $HYPRSCRIPT/default-browser
# Wi-Fi tray icon only where NetworkManager runs (iwd/networkd setups and VMs don't use it)
exec-once = systemctl is-active -q NetworkManager && nm-applet

# --- Albert & App Rules ---
# exec-once = QT_QPA_PLATFORM=xcb albert
# exec-once = vesktop
# exec-once = $music
# exec-once = hyprsunset

# --- MacBook Pro 2016/2017 audio fix (written by the hardware module) ---
# Switch to the Easy Effects sink that carries the Cirrus Logic fix
exec-once = [ -f /etc/modprobe.d/apple-audio.conf ] && easyeffects --gapplication-service
exec-once = [ -f /etc/modprobe.d/apple-audio.conf ] && sleep 5 && wpctl set-default $(wpctl status | grep -i "Easy Effects Sink" | head -n 1 | sed 's/[^0-9]*//g' | cut -c 1-2)
