windowrule = suppress_event maximize, match:class .*
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

# TAG:POPUP — floated utility windows
$POPUP_CLASS = feh|mpv|pureref|webcamoid|solaar|psensor|qalculate|iwgtk|easyeffects|desktop-portal|rofi|overskride|waypaper|missioncenter|cheatsheet|systemapp|pavucontrol|nwg-look
$POPUP_TITLE = Picture-in-Picture
windowrule {
	name = popup
	match:tag = popup

	float = true
	focus_on_activate = true
}
windowrule = match:class (?i).*($POPUP_CLASS).*, tag +popup
windowrule = match:title (?i).*($POPUP_TITLE).*, tag +popup

# Custom popup sizing
windowrule = size (monitor_w*0.7) (monitor_h*0.8), match:class ^(cheatsheet)$
windowrule = center 1, match:class ^(cheatsheet)$
windowrule = size (monitor_w*0.5) (monitor_h*0.6), match:class ^(systemapp)$
windowrule = center 1, match:class ^(systemapp)$

# TAG:FORCED — dialogs that must stay focused
$FORCED_CLASS = rofi|hyprpolkitagent
windowrule {
	name = forced
	match:tag = forced

	stay_focused = true
	dim_around = true
}
windowrule = match:class (?i).*($FORCED_CLASS).*, tag +forced

# Workspace Pinning
windowrule = workspace 1, match:class ^kitty$
windowrule = workspace 3, match:class ^Antigravity$
windowrule = workspace 4, match:class ^vesktop$
windowrule = workspace 5, match:class ^crx_blgdilankhbcpipclgpdndahbehalgkh$

# Albert Fixes
windowrule = stay_focused 1, match:class ^albert$
windowrule = center 1, match:class ^albert$

# --- Mac-style extras ---
# File pickers and dialogs float in the middle, like sheets on a Mac
windowrule = match:title (?i)^(open|save|choose|select|upload|export)( .*)?$, float on
windowrule = match:title (?i)^(open|save|choose|select|upload|export)( .*)?$, center on
# Frosted menu bar, Spotlight, Dock and notifications
layerrule = blur on, match:namespace ^(waybar|rofi|nwg-dock|notifications|hyprlain-switcher)$
# Blur only what is drawn: rofi's surface covers the whole screen
layerrule = ignore_alpha 0.3, match:namespace ^(waybar|rofi|nwg-dock|notifications|hyprlain-switcher)$
